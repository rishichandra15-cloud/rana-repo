trigger:
 branches:
   include:
     - main
     - feature/*

pool: rana-pool

stages:
  - stage: tfsec
    jobs:
      - job: tfsec
        displayName: tfsec
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tfsec'

  - stage: tflinnt
    jobs:
      - job: tflint
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tflint --recursive --force'


  - stage: init
    jobs:
      - job: 
        displayName: init
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

  - stage: plan 
    jobs:
      - job: plan
        displayName: plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'ranaservice'

  - stage: approval
    pool: server
    jobs:
      - job: approval
        displayName: approval
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'rishi@1234'


  - stage: apply
    jobs:
      - job: apply
        displayName: apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'ranaservice'